apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drivelog
  namespace: teslamate
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: internal-ca
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Teen driving hours log
    gethomepage.dev/group: Lifestyle
    gethomepage.dev/name: "Drive Log"
    gethomepage.dev/icon: "https://docs.teslamate.org/img/logo.svg"
spec:
  ingressClassName: traefik
  rules:
    - host: drivelog.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drivelog
                port:
                  number: 8080
  tls:
    - hosts:
        - drivelog.internal
      secretName: drivelog-tls
