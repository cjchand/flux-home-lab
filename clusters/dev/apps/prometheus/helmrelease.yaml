apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # Grafana is already provided by the loki-stack release (grafana.internal);
    # Prometheus is wired into it as a datasource instead of running a second Grafana.
    grafana:
      enabled: false

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          cert-manager.io/cluster-issuer: internal-ca
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Metrics
          gethomepage.dev/group: Monitoring
          gethomepage.dev/name: "Prometheus"
          gethomepage.dev/icon: "prometheus.png"
          # Homepage's default selector (app.kubernetes.io/name=<ingress name>)
          # matches nothing here; the operator labels the pod with this instead.
          gethomepage.dev/pod-selector: "operator.prometheus.io/name=prometheus-kube-prometheus-prometheus"
          gethomepage.dev/widget.type: prometheus
          gethomepage.dev/widget.url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
        hosts:
          - prometheus.internal
        paths:
          - /
        pathType: ImplementationSpecific
        tls:
          - hosts:
              - prometheus.internal
            secretName: prometheus-tls
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
