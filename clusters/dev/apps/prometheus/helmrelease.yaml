apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # The cluster's only general-purpose Grafana (TeslaMate runs its own).
    # Datasources and dashboards are provisioned from git; the PVC only holds
    # anything created in the UI.
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: nfs-client
        accessModes: ["ReadWriteOnce"]
        size: 1Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          cert-manager.io/cluster-issuer: internal-ca
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Dashboards
          gethomepage.dev/group: Monitoring
          gethomepage.dev/name: "Grafana"
          gethomepage.dev/icon: "grafana.png"
        hosts:
          - grafana.internal
        path: /
        tls:
          - hosts:
              - grafana.internal
            secretName: grafana-tls
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # microk8s's cluster CA has no Key Usage extension, which k8s-sidecar
      # (Python 3.13+) rejects under strict X.509 verification and crash-loops.
      # This relaxes only that flag; the API server cert is still verified.
      sidecar:
        dashboards:
          env:
            DISABLE_X509_STRICT_VERIFICATION: "true"
        datasources:
          env:
            DISABLE_X509_STRICT_VERIFICATION: "true"

    # microk8s runs etcd, the scheduler, controller-manager and kube-proxy
    # inside kubelite, so these ServiceMonitors never find a target. Disabling
    # them drops their empty dashboards and their always-firing "down" alerts.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          cert-manager.io/cluster-issuer: internal-ca
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Metrics
          gethomepage.dev/group: Monitoring
          gethomepage.dev/name: "Prometheus"
          gethomepage.dev/icon: "prometheus.png"
          # Homepage's default selector (app.kubernetes.io/name=<ingress name>)
          # matches nothing here; the operator labels the pod with this instead.
          gethomepage.dev/pod-selector: "operator.prometheus.io/name=prometheus-kube-prometheus-prometheus"
          gethomepage.dev/widget.type: prometheus
          gethomepage.dev/widget.url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
        hosts:
          - prometheus.internal
        paths:
          - /
        pathType: ImplementationSpecific
        tls:
          - hosts:
              - prometheus.internal
            secretName: prometheus-tls
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
