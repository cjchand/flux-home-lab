apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "41.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  values:
    # Certificate management with Let's Encrypt (v3 format)
    # Note: Currently using self-signed certificates for .internal domains
    # Let's Encrypt configuration kept for future use with real domains
    certificatesResolvers:
      letsencrypt:
        acme:
          email: admin@internal
          storage: /data/acme.json
          tlsChallenge: {}

    # Ingress configuration
    ingressClass:
      name: traefik

    # Persistence for certificates
    persistence:
      enabled: true
      storageClass: "nfs-client"
      accessMode: ReadWriteOnce
      size: 1Gi

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Service configuration
    service:
      type: LoadBalancer
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Traefik Dashboard
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/name: "Traefik"
        gethomepage.dev/icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Traefik.logo.svg/1200px-Traefik.logo.svg.png"

    # HTTP->HTTPS redirect.
    #
    # This lived under a top-level `entryPoints:` key until chart 41, which was
    # not a key this chart ever read -- it was silently ignored, so the redirect
    # never actually worked: port 80 answered 404 rather than redirecting. Chart
    # 41 added schema validation, which is what turned a silent no-op into a
    # visible upgrade failure.
    #
    # The chart expects this under ports.web, and the key is `entryPoint`
    # (singular, capital P), not `entrypoint`.
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

    # Prometheus metrics
    metrics:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s 