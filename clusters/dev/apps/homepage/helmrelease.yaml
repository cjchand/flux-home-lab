apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 5m
  chart:
    spec:
      chart: homepage
      version: "5.2.0"
      sourceRef:
        kind: HelmRepository
        name: monsterrr
        namespace: homepage
  values:
    # Image tag intentionally unset: it defaults to the chart appVersion, so the
    # app version moves only when the pinned chart version above moves.
    image:
      registry: ghcr.io
      repository: gethomepage/homepage
      pullPolicy: IfNotPresent

    # The chart derives HOMEPAGE_ALLOWED_HOSTS from ingress.hosts automatically;
    # this only adds the host served by homepage-traefik-ingress.yaml.
    config:
      allowedHosts:
        - homepage-traefik.internal

    service:
      port: 3000

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: internal-ca
      hosts:
        - host: homepage.internal
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - homepage.internal
          secretName: homepage-tls

    # The chart mounts its own emptyDir at /app/config. Config files are layered
    # in individually by subPath so they nest inside it rather than colliding
    # with it -- a whole-directory mount named "config" is what broke the 4.x->5.x
    # upgrade.
    volumes:
      - name: homepage-files
        configMap:
          name: homepage

    volumeMounts:
      - name: homepage-files
        mountPath: /app/config/settings.yaml
        subPath: settings.yaml
      - name: homepage-files
        mountPath: /app/config/services.yaml
        subPath: services.yaml
      - name: homepage-files
        mountPath: /app/config/widgets.yaml
        subPath: widgets.yaml
      - name: homepage-files
        mountPath: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
      - name: homepage-files
        mountPath: /app/config/kubernetes.yaml
        subPath: kubernetes.yaml
      - name: homepage-files
        mountPath: /app/config/docker.yaml
        subPath: docker.yaml
      - name: homepage-files
        mountPath: /app/config/custom.css
        subPath: custom.css
      - name: homepage-files
        mountPath: /app/config/custom.js
        subPath: custom.js

    rbac:
      enabled: true

    serviceAccount:
      create: true
      name: homepage
