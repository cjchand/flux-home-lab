apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-recorder-watchdog-script
  namespace: frigate
data:
  # Piped into the frigate container by cronjob-recorder-watchdog.yaml, so it
  # runs with Frigate's own python and can see (and signal) the record ffmpeg
  # processes. Pass --dry-run to only report.
  #
  # Why: when go2rtc reconnects to a camera, the stream's timestamps can jump
  # hours forward, and a record ffmpeg that cuts on stream time then cuts a
  # segment at every keyframe (2 s apart) instead of every 10 s, for hours.
  # Frigate's own watchdog doesn't notice, because segments are still being
  # created. An hour with more than ~1080 segments can't be played back in the
  # review UI: nginx-vod rejects the hour's playlist ("invalid number of
  # elements in the durations array") and the player spins forever. Seen on
  # 2026-10-28, when three Living Room hours had 1404-1539 segments.
  #
  # config.yml now cuts on the wall clock (-segment_atclocktime 1), which
  # prevents this. This is the backstop: restarting the recorder puts it back
  # on 10 s segments.
  #
  # It samples /tmp/cache rather than the recordings API, because Frigate
  # discards segments without motion, and a quiet camera would look healthy in
  # the API even while stuck.
  #
  # A jump the other way (stream timestamps going back hours) is the second
  # failure. With wall-clock cuts the segments still come every 10 s, but
  # ffmpeg won't let video timestamps go backwards across its output, so it
  # stamps each frame one tick after the last until the stream catches up
  # with where it was. Each segment then holds 10 s of real video that claims
  # to last ~0.07 s, and Frigate treats it as a 0.07 s recording. Seen
  # 2026-10-29, when Living Room and garage saved nothing usable from 23:00 to
  # 04:00. So the script also probes each segment that finishes during the
  # sample and restarts a recorder whose video lasts under MIN_VIDEO_SECONDS.
  check-recorders.py: |
    import glob
    import os
    import signal
    import subprocess
    import sys
    import time

    DRY_RUN = "--dry-run" in sys.argv
    CACHE = "/tmp/cache"
    SAMPLE_SECONDS = 30
    # 10 s segments: ~3 new files per camera in 30 s. Stuck: ~15.
    MAX_NEW_SEGMENTS = 8
    # Healthy segments hold ~10 s of video; frozen-timestamp ones ~0.07 s.
    MIN_VIDEO_SECONDS = 2
    FFPROBE = (sorted(glob.glob("/usr/lib/ffmpeg/*/bin/ffprobe")) or ["ffprobe"])[-1]


    def record_processes():
        """Map camera name -> pid of its record ffmpeg."""
        procs = {}
        for pid in filter(str.isdigit, os.listdir("/proc")):
            try:
                with open(f"/proc/{pid}/cmdline", "rb") as f:
                    args = f.read().decode(errors="replace").split("\0")
            except OSError:
                continue
            if not args or not args[0].endswith("ffmpeg") or "segment" not in args:
                continue
            for arg in args:
                if arg.startswith(f"{CACHE}/") and "@" in arg:
                    procs[arg[len(CACHE) + 1:].split("@")[0]] = int(pid)
        return procs


    def cache_segments():
        # camera_x@20261028063945-0500.mp4; previews are preview_camera_x_...
        return {f for f in os.listdir(CACHE) if "@" in f and f.endswith(".mp4")}


    def video_seconds(name):
        """Video duration of a finished cache segment, or None if it's gone."""
        try:
            out = subprocess.run(
                [FFPROBE, "-v", "error", "-select_streams", "v:0",
                 "-show_entries", "stream=duration", "-of", "csv=p=0",
                 f"{CACHE}/{name}"],
                capture_output=True, text=True, timeout=10).stdout
            return float(out.strip())
        except (ValueError, subprocess.SubprocessError):
            return None


    def newest(files, camera):
        return max((f for f in files if f.startswith(camera + "@")), default=None)


    seen = cache_segments()
    new = {}
    durations = {}
    deadline = time.time() + SAMPLE_SECONDS
    while time.time() < deadline:
        time.sleep(1)
        current = cache_segments()
        for f in sorted(current - seen):
            camera = f.split("@")[0]
            # A new file means the camera's previous one just finished; probe
            # it now, before Frigate moves it out of the cache.
            done = newest(seen, camera)
            if done and camera not in durations:
                seconds = video_seconds(done)
                if seconds is not None:
                    durations[camera] = seconds
            new.setdefault(camera, set()).add(f)
            seen.add(f)
        seen |= current

    for camera, pid in sorted(record_processes().items()):
        count = len(new.get(camera, ()))
        seconds = durations.get(camera)
        short = count > MAX_NEW_SEGMENTS
        frozen = seconds is not None and seconds < MIN_VIDEO_SECONDS
        print(f"{camera}: {count} new segments in {SAMPLE_SECONDS}s, "
              + (f"last one {seconds:.2f}s of video" if seconds is not None
                 else "none probed")
              + (" -> SHORT SEGMENTS" if short else "")
              + (" -> FROZEN TIMESTAMPS" if frozen else ""))
        if short or frozen:
            if DRY_RUN:
                print(f"{camera}: dry run, would restart record ffmpeg pid {pid}")
            else:
                os.kill(pid, signal.SIGTERM)
                print(f"{camera}: sent SIGTERM to record ffmpeg pid {pid}; "
                      "Frigate's watchdog will restart it")
