apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  # Frigate is not HA-able — it uses shared memory IPC between processes.
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    # Ensure the old pod is fully stopped before starting the new one,
    # so the NFS mount and /dev/shm are not contested between replicas.
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      initContainers:
        # The ConfigMap is the source of truth: config.yml is overwritten on every
        # start. Frigate's built-in UI config editor writes to the PVC, so any edit
        # made there is lost on the next restart — make config changes in
        # configmap-frigate.yaml instead. A timestamped backup of the replaced file
        # is kept so UI-drawn zones/masks can be recovered and ported into Git.
        #
        # This was previously a seed-only copy (`if [ ! -s /config/config.yml ]`),
        # which let the running config drift from the repo for months.
        - name: init-config
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              if [ -s /config/config.yml ] && ! cmp -s /config-seed/config.yml /config/config.yml; then
                echo "Live config differs from ConfigMap; backing up before overwrite"
                cp /config/config.yml "/config/config.yml.bak-$(date +%Y%m%d-%H%M%S)"
              fi
              echo "Applying config from ConfigMap"
              cp /config-seed/config.yml /config/config.yml
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: config-seed
              mountPath: /config-seed
        # Fetches the OpenVINO detection model onto the config PVC if it isn't already
        # there, or if the checksum doesn't match. The model is NOT committed to the repo
        # (binary artifacts don't belong in git history) — it's hosted as a checksummed
        # GitHub Release asset on this same repo instead:
        # https://github.com/cjchand/flux-home-lab/releases/tag/frigate-model-yolov9t-320-v1
        #
        # This only downloads once: the PVC persists across pod restarts, and the
        # checksum check means re-fetching only happens if the file is missing or
        # corrupted, not on every pod start. If the PVC is ever rebuilt, this
        # regenerates the model automatically with no manual step.
        #
        # curlimages/curl, not busybox: busybox:1.28 (already used by init-config above)
        # ships a wget too old to complete a TLS handshake with github.com. Pinned to an
        # exact tag for reproducibility.
        - name: init-model
          image: curlimages/curl:8.11.0
          # curlimages/curl defaults to a non-root user (uid 100), unlike busybox
          # (init-config, above) and Frigate's own image, both of which run as root.
          # The config PVC's content ends up root-owned as a result, so without this
          # the container can't write into it: curl fails with "client returned ERROR
          # on write" (EACCES surfacing through curl's write callback, not a clear
          # permission-denied message) rather than anything that names the real cause.
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              MODEL=/config/model_cache/yolov9t-320.onnx
              SHA256=e415adf344d6dc409b5cf9829eb55d0fd26816d90452dc18e59f2a5f4214c51e
              URL=https://github.com/cjchand/flux-home-lab/releases/download/frigate-model-yolov9t-320-v1/yolov9t-320.onnx

              mkdir -p /config/model_cache

              if [ -f "$MODEL" ] && echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
                echo "Model already present and checksum verified, skipping download"
                exit 0
              fi

              echo "Fetching detection model..."
              curl -fsSL -o "$MODEL.tmp" "$URL"
              echo "$SHA256  $MODEL.tmp" | sha256sum -c -
              mv "$MODEL.tmp" "$MODEL"
              echo "Model fetched and verified"
          volumeMounts:
            - name: config-storage
              mountPath: /config
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:stable
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 8971
              name: ui
            - containerPort: 8554
              name: rtsp
            - containerPort: 1984
              name: go2rtc
          env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-credentials
                  key: FRIGATE_RTSP_PASSWORD
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: recordings
              mountPath: /media/frigate
            # /dev/shm is required for Frigate's inter-process frame passing.
            # Without this volume, Frigate will crash or perform very poorly in k8s.
            # 512Mi is appropriate for 3–5 cameras; increase if you add more.
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              # Tune after observing actual usage. CPU scales with camera count and
              # resolution. Start here and adjust based on `kubectl top pod -n frigate`.
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
              # Intel HD 630 iGPU, advertised by the intel-gpu-plugin DaemonSet in
              # cluster-services. Requesting it both grants /dev/dri access and
              # constrains Frigate to a node with a free GPU slot.
              #
              # shared-dev-num is 1 cluster-wide, so this claims the whole iGPU on
              # whichever node Frigate lands on. That is intentional: the HD 630 has
              # a single render engine and detection needs it continuously.
              #
              # Not specified under requests: Kubernetes mirrors extended resources
              # from limits automatically.
              gpu.intel.com/i915: 1
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-seed
          configMap:
            name: frigate-config
        - name: recordings
          persistentVolumeClaim:
            claimName: frigate-recordings
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
