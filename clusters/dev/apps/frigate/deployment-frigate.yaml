apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  # Frigate is not HA-able — it uses shared memory IPC between processes.
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    # Ensure the old pod is fully stopped before starting the new one,
    # so the NFS mount and /dev/shm are not contested between replicas.
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      initContainers:
        # The ConfigMap is the source of truth: config.yml is overwritten on every
        # start. Frigate's built-in UI config editor writes to the PVC, so any edit
        # made there is lost on the next restart — make config changes in
        # configmap-frigate.yaml instead. A timestamped backup of the replaced file
        # is kept so UI-drawn zones/masks can be recovered and ported into Git.
        #
        # This was previously a seed-only copy (`if [ ! -s /config/config.yml ]`),
        # which let the running config drift from the repo for months.
        - name: init-config
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              if [ -s /config/config.yml ] && ! cmp -s /config-seed/config.yml /config/config.yml; then
                echo "Live config differs from ConfigMap; backing up before overwrite"
                cp /config/config.yml "/config/config.yml.bak-$(date +%Y%m%d-%H%M%S)"
              fi
              echo "Applying config from ConfigMap"
              cp /config-seed/config.yml /config/config.yml
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: config-seed
              mountPath: /config-seed
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:stable
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 8971
              name: ui
            - containerPort: 8554
              name: rtsp
            - containerPort: 1984
              name: go2rtc
          env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-credentials
                  key: FRIGATE_RTSP_PASSWORD
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: recordings
              mountPath: /media/frigate
            # /dev/shm is required for Frigate's inter-process frame passing.
            # Without this volume, Frigate will crash or perform very poorly in k8s.
            # 512Mi is appropriate for 3–5 cameras; increase if you add more.
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              # Tune after observing actual usage. CPU scales with camera count and
              # resolution. Start here and adjust based on `kubectl top pod -n frigate`.
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-seed
          configMap:
            name: frigate-config
        - name: recordings
          persistentVolumeClaim:
            claimName: frigate-recordings
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
