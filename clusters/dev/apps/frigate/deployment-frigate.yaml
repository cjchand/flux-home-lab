apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  # Frigate is not HA-able — it uses shared memory IPC between processes.
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    # Ensure the old pod is fully stopped before starting the new one,
    # so the NFS mount and /dev/shm are not contested between replicas.
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # Pinned to node-01: it is the only node with the Hailo-8L installed (M.2
      # 2230 WLAN slot). The gpu.intel.com/i915 request alone would allow any node
      # with a free iGPU, so without this pin Frigate could schedule onto node-03/04
      # where /dev/hailo0 does not exist and would crash-loop.
      nodeSelector:
        kubernetes.io/hostname: microk8s-node-01
      initContainers:
        # The ConfigMap is the source of truth: config.yml is overwritten on every
        # start. Frigate's built-in UI config editor writes to the PVC, so any edit
        # made there is lost on the next restart — make config changes in
        # configmap-frigate.yaml instead. A timestamped backup of the replaced file
        # is kept so UI-drawn zones/masks can be recovered and ported into Git.
        #
        # This was previously a seed-only copy (`if [ ! -s /config/config.yml ]`),
        # which let the running config drift from the repo for months.
        - name: init-config
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              if [ -s /config/config.yml ] && ! cmp -s /config-seed/config.yml /config/config.yml; then
                echo "Live config differs from ConfigMap; backing up before overwrite"
                cp /config/config.yml "/config/config.yml.bak-$(date +%Y%m%d-%H%M%S)"
              fi
              echo "Applying config from ConfigMap"
              cp /config-seed/config.yml /config/config.yml
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: config-seed
              mountPath: /config-seed
      # init-model removed: the OpenVINO yolov9s-320.onnx fetcher is obsolete under
      # the Hailo detector. Frigate downloads the architecture-matched .hef
      # (yolov6n) itself on first start and caches it to /config/model_cache/hailo —
      # see the model block in config.yml. The yolov9s-320-v1 release asset is left
      # in place in case the OpenVINO path is ever restored from git history.
      containers:
        - name: frigate
          # Pinned, not :stable. 0.17.2 ships HailoRT 4.21.0, which must match the
          # hailo_pci host driver (ansible/roles/hailo, hailo_version). :stable has
          # since moved to 0.18.x, so a floating tag would have pulled a different
          # release on the rollout restart, bundling a version jump with the
          # detector swap. Bump this and hailo_version together, after checking
          # the HailoRT version the new release ships. Renovate does not track
          # this image (renovate.json only covers intel-gpu-plugin.yaml).
          image: ghcr.io/blakeblackshear/frigate:0.17.2
          # Hailo-8L device access. Kubernetes has no per-char-device grant, so the
          # container runs privileged to reach /dev/hailo0 (mounted below). The
          # less-privileged alternative is a device plugin that advertises the Hailo
          # as an extended resource (mirrors intel-gpu-plugin, and would also make
          # the nodeSelector above redundant); see the PR description.
          securityContext:
            privileged: true
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 8971
              name: ui
            - containerPort: 8554
              name: rtsp
            - containerPort: 1984
              name: go2rtc
          env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-credentials
                  key: FRIGATE_RTSP_PASSWORD
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: recordings
              mountPath: /media/frigate
            # /dev/shm is required for Frigate's inter-process frame passing.
            # Without this volume, Frigate will crash or perform very poorly in k8s.
            # 512Mi is appropriate for 3–5 cameras; increase if you add more.
            - name: dshm
              mountPath: /dev/shm
            # Hailo-8L accelerator on node-01 (M.2 WLAN slot). Requires the
            # hailo_pci driver on the host so /dev/hailo0 exists before rollout;
            # see the detectors block in config.yml.
            - name: hailo
              mountPath: /dev/hailo0
          resources:
            requests:
              # Tune after observing actual usage. CPU scales with camera count and
              # resolution. Start here and adjust based on `kubectl top pod -n frigate`.
              cpu: "2"
              memory: 3Gi
            limits:
              cpu: "4"
              # Normal usage is ~3 GB. Frigate still leaks memory while a camera
              # flaps (2026-10-27: 3.1 GB to the old 6Gi limit and an OOMKill after
              # ~8 h of garage WiFi drops). 8Gi buys headroom; it isn't a fix.
              memory: 8Gi
              # Intel HD 630 iGPU, advertised by the intel-gpu-plugin DaemonSet in
              # cluster-services. Requesting it both grants /dev/dri access and
              # constrains Frigate to a node with a free GPU slot.
              #
              # shared-dev-num is 1 cluster-wide, so this claims the whole iGPU on
              # whichever node Frigate lands on. That is intentional: the HD 630 has
              # a single render engine and detection needs it continuously.
              #
              # Not specified under requests: Kubernetes mirrors extended resources
              # from limits automatically.
              gpu.intel.com/i915: 1
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-seed
          configMap:
            name: frigate-config
        - name: recordings
          persistentVolumeClaim:
            claimName: frigate-recordings
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        # Char device node for the Hailo-8L. type: CharDevice makes the kubelet
        # verify it is a character device at mount time (fails fast if the host
        # driver is missing) rather than silently creating a directory.
        - name: hailo
          hostPath:
            path: /dev/hailo0
            type: CharDevice
