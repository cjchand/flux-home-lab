mqtt:
  enabled: true
  host: mosquitto.mqtt.svc.cluster.local
  port: 1883

detectors:
  # OpenVINO on the Intel HD 630 iGPU. Proven on CPU first (real inference,
  # zero errors, stable) before flipping to GPU, since the model-path bug
  # below is in code shared by both device paths.
  #
  # Verified against the actual Frigate 0.17.2 source
  # (frigate/detectors/plugins/openvino.py and detection_runners.py) after the
  # first attempt crashed the whole container: the openvino detector has NO
  # bundled-default code path. model.path is required unconditionally; without
  # it, OpenVINOModelRunner.__init__ calls os.path.isfile(None) and raises
  # before the detector process can start — and Frigate does not isolate that
  # failure to the subprocess, the whole container restarts.
  #
  # The device is granted by the gpu.intel.com/i915 resource request in
  # deployment-frigate.yaml, not by a hostPath mount — see
  # docs/Applications/intel-gpu-plugin.md.
  ov:
    type: openvino
    device: GPU

# YOLOv9-t at 320x320, replacing the bundled ssdlite_mobilenet_v2 (proven working
# first — see git history — before this upgrade) for better detection accuracy.
# yolov9t chosen over the docs' general starting recommendation of yolov9s: this
# is a genuinely weak, low-power Gen9.5 iGPU (24 EUs), and yolov9t is what the
# Frigate community actually runs on comparably weak Intel iGPUs (verified
# against a real working example, not just picked as a guess).
#
# model_type: yolo-generic — NOT "yolov9". That looks like the obviously-correct
# value and is invalid in Frigate 0.17: it silently drops the detector into a
# safe-mode CPU fallback with garbage detections instead of erroring, which is a
# much worse failure to debug than a crash. Confirmed against
# frigate/detectors/detector_config.py's ModelTypeEnum directly — yolo-generic
# is the only valid value for any Ultralytics YOLO export (v8/v9/v11/etc).
#
# input_tensor: nchw and input_dtype: float are verified directly from the
# exported .onnx file's input node (shape [1,3,320,320], FLOAT) — not assumed.
# input_pixel_format: bgr is not independently verifiable from the ONNX file
# itself (it describes a preprocessing convention, not something the file
# encodes); taken from a working real-world OpenVINO+YOLOv9t setup on similarly
# weak Intel iGPU hardware.
#
# The .onnx file itself is NOT committed to the repo — binaries don't belong in
# git history. It's fetched by an init container in deployment-frigate.yaml from
# a checksummed GitHub Release asset on this same repo, onto the config PVC, on
# first pod start only (see that file's comment for the full mechanism).
model:
  path: /config/model_cache/yolov9t-320.onnx
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_pixel_format: bgr
  input_dtype: float
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  # VAAPI, not QSV: VAAPI is the correct path for Gen9.5 integrated graphics.
  #
  # Every detect stream on this cluster is a 640x480 H.264 substream, which is
  # cheap to decode in software. VAAPI carries per-stream setup and frame-copy
  # overhead that can consume the saving at that resolution, so this is expected
  # to be roughly break-even. Kept as its own commit so it can be reverted alone
  # if it isn't.
  hwaccel_args: preset-vaapi

# HTTP-FLV is used instead of raw RTSP — Reolink's RTSP implementation has known
# instability in Frigate. See: https://docs.frigate.video/configuration/camera_specific/
# Enable HTTP on each camera: Reolink app → Camera Settings → Network → Advanced → HTTP
# Do NOT auto-update Reolink firmware once working: https://github.com/AT0myks/reolink-fw-archive
# Reolink E1 Pro is a WiFi camera — it does not support the bcs HTTP-FLV stream
# format used by Reolink NVR/PoE cameras. Use plain RTSP instead.
go2rtc:
  streams:
    camera_kitchen:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.37:554/h264Preview_01_main"
    camera_kitchen_sub:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.37:554/h264Preview_01_sub"
    camera_living_room:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.66:554/h264Preview_01_main"
    camera_living_room_sub:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.66:554/h264Preview_01_sub"
    camera_workout_room:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.65:554/h264Preview_01_main"
    camera_workout_room_sub:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.65:554/h264Preview_01_sub"
    camera_garage:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.47:554/h264Preview_01_main"
    camera_garage_sub:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.47:554/h264Preview_01_sub"
    camera_doorbell:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.62:554/h264Preview_01_main"
    camera_doorbell_sub:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.86.62:554/h264Preview_01_sub"

cameras:
  camera_kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_kitchen
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_kitchen_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 480
      # 5 FPS is sufficient for person detection and saves significant CPU.
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: true
    snapshots:
      enabled: true

  camera_living_room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_living_room
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_living_room_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: true
    snapshots:
      enabled: true

  camera_workout_room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_workout_room
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_workout_room_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
    # Drawn in the Frigate UI; masks a reflective surface that generated
    # constant false motion. Coordinates are normalized (0–1).
    motion:
      mask: 0.695,0.68,0.693,0.758,0.773,0.751,0.774,0.667
    record:
      enabled: true
    snapshots:
      enabled: true

  camera_garage:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_garage
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_garage_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 480
      # 5 FPS is sufficient for person detection and saves significant CPU.
      fps: 5
    objects:
      track:
        - person
      # Drawn in the Frigate UI. Normalized coordinates, so these stay valid
      # now that detect runs on the sub stream instead of the main stream.
      mask:
        - 0.031,0.218,0.031,0.295,0.062,0.297,0.062,0.213
        - 0.226,0.171,0.233,0.276,0.287,0.277,0.286,0.154
    record:
      enabled: true
    snapshots:
      enabled: true

  camera_doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_doorbell
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 480
      # 5 FPS is sufficient for person detection and saves significant CPU.
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: true
    snapshots:
      enabled: true

birdseye:
  enabled: true
  # motion: only shows cameras with recent motion — saves resources
  mode: motion

# Recordings are stored under /media/frigate, which is mounted from the NFS PVC.
#
# Storage math, measured 2026-08-30 (NOT estimated — the earlier 5–8 GB/camera/day
# figure in this file was wrong by ~4x):
#   ~32 GB/camera/day for `motion` retention (doorbell ~42 GB), so ~160 GB/day
#   across 5 cameras. `motion.days: 7` therefore cost 1.2 TB and nearly filled
#   the NAS.
#
# Why `motion` retention is so expensive here: it keeps any segment whose motion
# count is > 0, and on these cameras that is *every* segment. A survey of 318,916
# retained segments found zero with motion == 0, so `motion` mode is currently
# equivalent to continuous 24/7 recording. Until motion.threshold/contour_area are
# tuned per camera, treat `motion.days` as "days of continuous recording" when
# doing storage math.
#
# By contrast, alerts/detections retention is nearly free: segments 8–13 days old
# (past the motion window, inside the event window) total only ~150 MB/day, because
# there are just a few hundred person events per fortnight. That is why the event
# windows below are generous and the motion window is short.
#
# Current cost: ~320 GB (2 days motion) + ~5 GB (30 days of events).
record:
  enabled: true
  motion:
    # A 48-hour scrub-back buffer. Raising this costs ~160 GB per extra day.
    days: 2
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

# Kept in step with the alert/detection retention above. If snapshots expire
# first, the events list shows entries whose thumbnails have already been
# deleted. Snapshots are single JPEGs, so this costs very little.
snapshots:
  retain:
    default: 30
