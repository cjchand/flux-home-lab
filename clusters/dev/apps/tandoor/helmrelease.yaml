---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor
  namespace: tandoor
spec:
  chart:
    spec:
      chart: tandoor
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: gabe565
  interval: 1h
  releaseName: tandoor
  values:
    #
    # IMPORTANT NOTE
    #
    # This chart inherits from our common library chart. You can check the default values/options here:
    # https://github.com/bjw-s/helm-charts/blob/a081de5/charts/library/common/values.yaml
    #

    image:
      # -- image repository
      repository: ghcr.io/tandoorrecipes/recipes
      # -- image tag
      tag: 2.2.7
      # -- image pull policy
      pullPolicy: IfNotPresent
      # -- image tag

    # -- environment variables. [[ref]](https://github.com/TandoorRecipes/recipes/blob/master/.env.template).
    # @default -- See [values.yaml](./values.yaml)
    env:
      # -- default timezone
      TIMEZONE: UTC
      SOCIAL_PROVIDERS: 
      # The app talks to the CNPG cluster tandoor-pg. These override the values
      # the chart derives from the (still enabled) Bitnami subchart below.
      POSTGRES_HOST: tandoor-pg-rw
      POSTGRES_USER:
        secretKeyRef:
          name: tandoor-pg-app
          key: username
      POSTGRES_PASSWORD:
        secretKeyRef:
          name: tandoor-pg-app
          key: password
      # SECRET_KEY: changeme

    resources:
      requests:
        cpu: 100m
        memory: 1Gi

    service:
      # -- Configures service settings for the chart.
      # @default -- See [values.yaml](./values.yaml)
      main:
        ports:
          http:
            port: 8080
          static:
            port: 80

    ingress:
      # -- Enable and configure ingress settings for the chart under this key.
      # @default -- See [values.yaml](./values.yaml)
      main:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          cert-manager.io/cluster-issuer: internal-ca
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Tandoor Recipes
          gethomepage.dev/group: Lifestyle
          gethomepage.dev/name: "Tandoor Recipes"
          gethomepage.dev/icon: "https://tandoor.dev/static/assets/brand_logo.png"
        hosts:
          - host: recipes.internal
            paths:
              - path: /
              - path: /static
                service:
                  port: 80
              - path: /media
                service:
                  port: 80
        tls:
          - hosts:
              - recipes.internal
            secretName: tandoor-tls

    # -- Configure persistence settings for the chart under this key.
    # @default -- See [values.yaml](./values.yaml)
    persistence:
      config:
        enabled: true
        retain: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 1Gi
      media:
        enabled: true
        mountPath: /opt/recipes/mediafiles
        retain: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 1Gi
      static:
        enabled: true
        type: emptyDir
        mountPath: /opt/recipes/staticfiles
      django-js-reverse:
        enabled: true
        type: emptyDir
        mountPath: /opt/recipes/cookbook/static/django_js_reverse

    # -- Enable and configure postgresql database subchart under this key. [[ref]](https://github.com/bitnami/charts/tree/master/bitnami/mariadb)
    # @default -- See [values.yaml](./values.yaml)
    postgresql:
      enabled: true
      # No longer used by the app: it moved to the CNPG cluster tandoor-pg (see
      # cnpg-cluster.yaml). This subchart is kept running, on the unmaintained
      # bitnamilegacy image (Bitnami withdrew the original tag), only as the
      # rollback. Retire it by hand, with an explicit OK, then remove this whole
      # block plus bootstrap.initdb.import / externalClusters in cnpg-cluster.yaml.
      image:
        repository: bitnamilegacy/postgresql
        tag: 16.2.0-debian-11-r1
      auth:
        database: tandoor
        postgresPassword: changeme
      primary:
        persistence:
          enabled: true
          storageClass: "nfs-client"
          size: 8Gi

    podSecurityContext:
      # -- Run as `nobody` user
      runAsUser: 65534
      # -- Run as `nobody` group
      runAsGroup: 65534
      # -- Volume binds will be granted to `nobody` group
      fsGroup: 65534