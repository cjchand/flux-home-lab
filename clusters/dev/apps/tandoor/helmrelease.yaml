---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor
  namespace: tandoor
spec:
  chart:
    spec:
      chart: tandoor
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: gabe565
  interval: 1h
  releaseName: tandoor
  values:
    #
    # IMPORTANT NOTE
    #
    # This chart inherits from our common library chart. You can check the default values/options here:
    # https://github.com/bjw-s/helm-charts/blob/a081de5/charts/library/common/values.yaml
    #

    image:
      # -- image repository
      repository: ghcr.io/tandoorrecipes/recipes
      # -- image tag
      tag: 2.2.7
      # -- image pull policy
      pullPolicy: IfNotPresent
      # -- image tag

    # -- environment variables. [[ref]](https://github.com/TandoorRecipes/recipes/blob/master/.env.template).
    # @default -- See [values.yaml](./values.yaml)
    env:
      # -- default timezone
      TIMEZONE: UTC
      SOCIAL_PROVIDERS: 
      # SECRET_KEY: changeme

    service:
      # -- Configures service settings for the chart.
      # @default -- See [values.yaml](./values.yaml)
      main:
        ports:
          http:
            port: 8080
          static:
            port: 80

    ingress:
      # -- Enable and configure ingress settings for the chart under this key.
      # @default -- See [values.yaml](./values.yaml)
      main:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          cert-manager.io/cluster-issuer: internal-ca
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Tandoor Recipes
          gethomepage.dev/group: Lifestyle
          gethomepage.dev/name: "Tandoor Recipes"
          gethomepage.dev/icon: "https://tandoor.dev/static/assets/brand_logo.png"
        hosts:
          - host: recipes.internal
            paths:
              - path: /
              - path: /static
                service:
                  port: 80
              - path: /media
                service:
                  port: 80
        tls:
          - hosts:
              - recipes.internal
            secretName: tandoor-tls

    # -- Configure persistence settings for the chart under this key.
    # @default -- See [values.yaml](./values.yaml)
    persistence:
      config:
        enabled: true
        retain: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 1Gi
      media:
        enabled: true
        mountPath: /opt/recipes/mediafiles
        retain: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 1Gi
      static:
        enabled: true
        type: emptyDir
        mountPath: /opt/recipes/staticfiles
      django-js-reverse:
        enabled: true
        type: emptyDir
        mountPath: /opt/recipes/cookbook/static/django_js_reverse

    # -- Enable and configure postgresql database subchart under this key. [[ref]](https://github.com/bitnami/charts/tree/master/bitnami/mariadb)
    # @default -- See [values.yaml](./values.yaml)
    postgresql:
      enabled: true
      # Bitnami retired its public Docker Hub catalogue and the tag this subchart
      # defaults to, 16.2.0-debian-11-r1, now 404s on docker.io/bitnami. It kept
      # running here only from each node's local image cache; the microk8s 1.33
      # upgrade drained the node, the pod was rescheduled, the pull failed and
      # the database has been in ImagePullBackOff since -- which is what made
      # recipes.internal return 503.
      #
      # bitnamilegacy is Bitnami's archive of the withdrawn images and still
      # serves this exact tag. It is a stopgap, not a home: nothing there is
      # maintained or patched. The real fix is moving off these images, and the
      # cloudnative-pg operator already running in cluster-services is the
      # obvious destination.
      image:
        repository: bitnamilegacy/postgresql
        tag: 16.2.0-debian-11-r1
      auth:
        database: tandoor
        postgresPassword: changeme
      primary:
        persistence:
          enabled: true
          storageClass: "nfs-client"
          size: 8Gi

    podSecurityContext:
      # -- Run as `nobody` user
      runAsUser: 65534
      # -- Run as `nobody` group
      runAsGroup: 65534
      # -- Volume binds will be granted to `nobody` group
      fsGroup: 65534