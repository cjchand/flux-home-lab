apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    # One Loki process with filesystem storage on NFS. The chart defaults to
    # SimpleScalable with memcached caches (~8 GB reserved), a gateway, MinIO
    # and a canary; everything below that is set to 0/false turns those off.
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-10-03"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 168h    # 7 days by default
        retention_stream:
          - selector: '{namespace=~"kube-system|monitoring|teslamate"}'
            priority: 1
            period: 336h          # 14 days
        max_query_lookback: 336h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        storageClass: nfs-client
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    minio:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    # No alerting/recording rules are loaded from ConfigMaps.
    sidecar:
      rules:
        enabled: false
