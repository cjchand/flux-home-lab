---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  interval: 2h
  chart:
    spec:
      chart: uptime-kuma
      version: 4.2.0
      sourceRef:
        kind: HelmRepository
        name: dirsigler-uptime-kuma
        namespace: monitoring
  releaseName: uptime-kuma
  values:
    externalDatabase:
      enabled: true
      type: mariadb
      hostname: uptime-kuma-mariadb.monitoring.svc.cluster.local
      port: 3306
      database: uptime_kuma
      existingSecret: uptime-kuma-mariadb
      existingSecretUsernameKey: username
      existingSecretPasswordKey: password
    # NOTE: no image.tag override here on purpose. The old `tag: "2-slim"`
    # was a floating tag that silently rolled this install from v1 to v2 on
    # 2025-11-26. The chart pins the app version instead; Renovate bumps the
    # chart, so major upgrades arrive as a reviewable PR.
    useDeploy: false
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: internal-ca
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Monitoring Server
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: "https://uptime.kuma.pet/img/icon.svg"
        gethomepage.dev/name: "Uptime Kuma"
        gethomepage.dev/pod-selector: ""
      hosts:
        - host: monitoring.internal
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - monitoring.internal
          secretName: uptime-kuma-tls
    volume:
      enabled: true
      storageClassName: nfs-client
      accessMode: ReadWriteMany
      size: 8Gi
    service:
      type: ClusterIP
      port: 3001
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
