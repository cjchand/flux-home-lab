---
# MariaDB backing store for Uptime Kuma.
#
# Storage is nfs-client, matching the rest of the cluster, so the database
# falls inside the NAS backup scope.
#
# This is safe here even though SQLite on the same NFS was not. SQLite in WAL
# mode coordinates multiple *client* processes through an mmap'd -shm file,
# which NFS cannot keep coherent -- that is what corrupted the old database on
# 2025-11-26. MariaDB is a different shape: a single server process owns the
# data directory exclusively and clients reach it over TCP, so there is no
# cross-client mmap to lose coherence.
#
# The one rule that matters: never let two mysqld processes open this datadir
# at once, or InnoDB will corrupt. The StatefulSet guarantees at most one pod
# per ordinal; do not force-delete the pod while it may still be running on an
# unreachable node.
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-mariadb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uptime-kuma-mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    app.kubernetes.io/name: uptime-kuma-mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uptime-kuma-mariadb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uptime-kuma-mariadb
spec:
  replicas: 1
  serviceName: uptime-kuma-mariadb
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma-mariadb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
            - --max-connections=200
          env:
            - name: MARIADB_DATABASE
              value: uptime_kuma
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: root-password
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-client
        resources:
          requests:
            storage: 8Gi
