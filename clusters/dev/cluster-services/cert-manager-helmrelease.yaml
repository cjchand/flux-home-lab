apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      # Stepping to v1.20.x, which supports Kubernetes 1.32 -> 1.35 and so spans
      # the upcoming microk8s 1.33 upgrade. v1.21 is newer but supports only
      # 1.33 -> 1.36, so adopting it before the cluster moves would leave this
      # unsupported in the meantime.
      #
      # cert-manager asks that you upgrade one minor at a time, so the route is
      # v1.16.2 -> v1.17.4 -> v1.18.6 -> v1.19.6 -> v1.20.3, verifying the
      # internal-ca ClusterIssuer and all Certificates between each step.
      version: "v1.18.6"
  interval: 1h
  targetNamespace: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    global:
      # Disable cert-manager validation webhook for namespace creation
      # This prevents chicken-and-egg problems
      leaderElection:
        namespace: cert-manager
    webhook:
      # Allow webhook to start even if cert-manager is not fully ready
      timeoutSeconds: 30
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

