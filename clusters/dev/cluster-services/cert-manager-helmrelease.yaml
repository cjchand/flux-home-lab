apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      # v1.20 supports Kubernetes 1.32 -> 1.35, so it spans the microk8s 1.33
      # upgrade. v1.21 is newer but supports only 1.33 -> 1.36: revisit it once
      # the cluster is actually on 1.33, not before.
      #
      # cert-manager asks that you upgrade one minor at a time. Reached here via
      # v1.16.2 -> v1.17.4 -> v1.18.6 -> v1.19.6 -> v1.20.3, verifying the
      # internal-ca ClusterIssuer and all Certificates between each step.
      version: "v1.20.3"
  interval: 1h
  targetNamespace: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Replaces the deprecated installCRDs: true, which the chart now treats as
    # shorthand for exactly these two values. keep: true is the important half --
    # it is what stops the CRDs, and every Certificate stored in them, being
    # deleted if this release is ever uninstalled.
    crds:
      enabled: true
      keep: true
    global:
      # Disable cert-manager validation webhook for namespace creation
      # This prevents chicken-and-egg problems
      leaderElection:
        namespace: cert-manager
    webhook:
      # Allow webhook to start even if cert-manager is not fully ready
      timeoutSeconds: 30
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

