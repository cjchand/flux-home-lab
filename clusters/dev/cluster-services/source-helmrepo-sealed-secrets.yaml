apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 1h0m0s
  # The project moved from bitnami-labs/sealed-secrets to bitnami/sealed-secrets
  # and its GitHub Pages chart index moved with it; the old host now returns a
  # hard 404, which left this HelmRepository with no artifact and the release
  # unupgradeable. 2.18.6 and earlier are still published at the new host.
  url: https://bitnami.github.io/sealed-secrets