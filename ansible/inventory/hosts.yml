---
all:
  children:
    microk8s:
      children:
        microk8s_primary:
          hosts:
            microk8s-node-01:
              ansible_host: 192.168.86.30
              # Subnet router for Tailscale - advertises home network
              tailscale_advertise_routes:
                - "192.168.86.0/24"
        microk8s_workers:
          hosts:
            microk8s-node-03:
              ansible_host: 192.168.86.57
            microk8s-node-04:
              ansible_host: 192.168.86.74
      vars:
        ansible_user: cjchand
        ansible_python_interpreter: /usr/bin/python3
        # Nodes on the same LAN don't need to accept subnet routes - accepting
        # the 192.168.86.0/24 route advertised by node-01 breaks local LAN connectivity
        tailscale_accept_routes: false
    # Nodes with a Hailo-8L accelerator (M.2 2230 WLAN slot). Only node-01 has
    # one; Frigate is pinned there by nodeSelector. The host is also in the
    # microk8s group above, so it keeps that group's ansible_user etc.
    hailo:
      hosts:
        microk8s-node-01:
